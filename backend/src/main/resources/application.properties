spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/logadvisor
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SerpApi
#  https://serpapi.com/dashboard
serpapi.key=${SERPAPI_KEY}

# Groq (prefixed with app. to avoid LangChain4j Spring Boot auto-configuration)
#  https://console.groq.com/keys
app.groq.api-key=${GROQ_API_KEY}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:150}

# Chroma
chroma.url=http://localhost:8001
chroma.collection=logadvisor_articles

# RAG
rag.min-score=0.7

# Prompt budgets in characters (~3.8 chars per token). The Groq free tier allows 8000 tokens per
# minute (prompt + answer) and rejects bigger requests, so keep these low unless the plan is upgraded.
app.kb.prompt-budget-chars=${KB_PROMPT_BUDGET_CHARS:7000}
app.rules.prompt-budget-chars=${RULES_PROMPT_BUDGET_CHARS:12000}

# Search mode 1.3: up to this many new articles per technology are added to the KB before answering
app.kb.new-articles.per-technology=5

# Search mode 1.1: rules file built from the dissertation bibliography
app.rules.file=rules/regras_loggingadvisor_pt.txt

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Default admin user (created on startup if missing)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
