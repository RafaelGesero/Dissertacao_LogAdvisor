spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/logadvisor
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SerpApi
#  https://serpapi.com/dashboard
serpapi.key=${SERPAPI_KEY}

# Groq (prefixed with app. to avoid LangChain4j Spring Boot auto-configuration)
#  https://console.groq.com/keys
app.groq.api-key=${GROQ_API_KEY}
app.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Chroma
chroma.url=http://localhost:8001
chroma.collection=logadvisor_articles

# RAG
rag.min-score=0.7

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Default admin user (created on startup if missing)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
